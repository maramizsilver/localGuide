<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - LocalGuide</title>
    <link rel="stylesheet" href="../css/style_nav_barre.css">
    <style>
        /* mêmes styles que login.html */
        .register-container { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 150px); padding: 20px; }
        .register-card { background: white; border-radius: 32px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        h1 { font-size: 28px; color: #2d2a24; margin-bottom: 8px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select { width: 100%; padding: 14px 16px; border: 2px solid #e8ddd0; border-radius: 16px; font-size: 15px; }
        .btn-register { width: 100%; padding: 14px; background: linear-gradient(135deg, #d42b2b, #a31f1f); color: white; border: none; border-radius: 16px; font-weight: 600; cursor: pointer; }
        .message { margin-top: 20px; padding: 12px; border-radius: 12px; }
        .error { background: #fee2e2; color: #d42b2b; }
        .success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <header class="nav"><!-- navbar identique --></header>
    <div class="register-container">
        <div class="register-card">
            <h1>Créer un compte</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" id="fullname" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label>Type de compte</label>
                    <select id="role">
                        <option value="client">Client (laisser des avis)</option>
                        <option value="commerçant">Commerçant (ajouter mon commerce)</option>
                        <option value="guide">Guide touristique</option>
                    </select>
                </div>
                <button type="submit" class="btn-register">S'inscrire</button>
            </form>
            <div id="message"></div>
            <p style="text-align:center; margin-top:20px">
                Déjà un compte ? <a href="login.html">Se connecter</a>
            </p>
        </div>
    </div>
    <script type="module">
        import { supabase } from '../js/supabaseClient.js'
        
        const form = document.getElementById('registerForm')
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const fullname = document.getElementById('fullname').value
            const role = document.getElementById('role').value
            
            const { data, error } = await supabase.auth.signUp({
                email, password
            })
            
            if (error) {
                document.getElementById('message').innerHTML = '❌ ' + error.message
                return
            }
            
            // Créer le profil
            await supabase.from('users_profiles').insert({
                id: data.user.id,
                display_name: fullname,
                role: role
            })
            
            document.getElementById('message').innerHTML = '✅ Compte créé ! Redirection...'
            setTimeout(() => { window.location.href = 'login.html' }, 2000)
        })
    </script>
</body>
</html>
