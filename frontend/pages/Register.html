<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - LocalGuide</title>
    <link rel="icon" type="image/png" href="../images/logo_nav.png">
    <link rel="stylesheet" href="../css/style_nav_barre.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8f2eb 0%, #ede4d8 100%);
            min-height: 100vh;
            padding-top: 85px;
        }

        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 150px);
            padding: 40px 20px;
        }

        .register-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 28px;
            color: #2c1810;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #7a5a50;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c1810;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8ddd0;
            border-radius: 16px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #d42b2b;
            box-shadow: 0 0 0 3px rgba(212, 43, 43, 0.1);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d42b2b, #8b1a1a);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 43, 43, 0.3);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #d42b2b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #7a5a50;
        }

        .login-link a {
            color: #d42b2b;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .role-info {
            background: #f8f2eb;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 12px;
            color: #7a5a50;
            display: none;
        }

        .role-info.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<header class="nav">
    <div class="nav-inner">
        <nav class="nav-left">
            <a href="accueil.html">Accueil</a>
            <a href="add.html">Ajouter commerce</a>
            <a href="fichecomm.html">Commerces</a>
        </nav>
        <a href="accueil.html" class="nav-logo">
            <img src="../images/logo1.png" alt="LocalGuide Logo" />
        </a>
        <nav class="nav-right">
            <a href="news.html">Nouveautés</a>
            <a href="guide.html">Nos guides</a>
            <a href="admin.html" id="adminNavLink" style="display: none;">Admin</a>
        </nav>
    </div>
</header>

<div class="register-container">
    <div class="register-card">
        <h1>✨ Créer un compte</h1>
        <p class="subtitle">Rejoignez la communauté LocalGuide</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Nom complet *</label>
                <input type="text" id="fullname" placeholder="Ex: Jean Dupont" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="exemple@email.com" required>
            </div>

            <div class="form-group">
                <label>Téléphone *</label>
                <input type="tel" id="phone" placeholder="+216 XX XXX XXX" required>
            </div>

            <div class="form-group">
                <label>Mot de passe *</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe *</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Type de compte *</label>
                <select id="role">
                    <option value="client">👤 Client (découvrir et réserver)</option>
                    <option value="commercant">🏪 Commerçant (ajouter mon commerce)</option>
                    <option value="guide">🗺️ Guide touristique (proposer des visites)</option>
                </select>
                <div class="role-info" id="roleInfo">
                    💡 En tant que guide, vous pourrez créer votre profil, proposer des visites et gérer vos réservations.
                </div>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="conditions" required style="width: auto;">
                    J'accepte les <a href="#" style="color:#d42b2b;">conditions d'utilisation</a>
                </label>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">
                <span id="submitText">S'inscrire</span>
                <span id="submitSpinner" style="display: none;"></span>
            </button>
        </form>

        <div id="message"></div>

        <div class="login-link">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../js/supabaseClient.js'

    const form = document.getElementById('registerForm')
    const messageDiv = document.getElementById('message')
    const submitBtn = document.getElementById('submitBtn')
    const submitText = document.getElementById('submitText')
    const submitSpinner = document.getElementById('submitSpinner')
    const roleSelect = document.getElementById('role')
    const roleInfo = document.getElementById('roleInfo')

    // Afficher l'info du rôle sélectionné
    roleSelect.addEventListener('change', () => {
        const role = roleSelect.value
        if (role === 'guide') {
            roleInfo.innerHTML = '🗺️ En tant que guide, vous pourrez :<br>- Créer votre profil de guide<br>- Proposer des visites touristiques<br>- Gérer vos réservations<br>- Être mis en avant sur la plateforme'
            roleInfo.classList.add('show')
        } else if (role === 'commercant') {
            roleInfo.innerHTML = '🏪 En tant que commerçant, vous pourrez :<br>- Ajouter votre commerce<br>- Gérer vos horaires et informations<br>- Recevoir des avis clients'
            roleInfo.classList.add('show')
        } else {
            roleInfo.innerHTML = '👤 En tant que client, vous pourrez :<br>- Découvrir les commerces et guides<br>- Laisser des avis<br>- Réserver des visites guidées'
            roleInfo.classList.add('show')
        }
    })
    roleSelect.dispatchEvent(new Event('change'))

    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        
        const fullname = document.getElementById('fullname').value.trim()
        const email = document.getElementById('email').value.trim()
        const phone = document.getElementById('phone').value.trim()
        const password = document.getElementById('password').value
        const confirmPassword = document.getElementById('confirmPassword').value
        const role = document.getElementById('role').value
        const conditions = document.getElementById('conditions').checked

        // Validation
        if (!fullname || !email || !phone || !password) {
            messageDiv.innerHTML = '❌ Veuillez remplir tous les champs'
            messageDiv.className = 'message error'
            return
        }

        if (password !== confirmPassword) {
            messageDiv.innerHTML = '❌ Les mots de passe ne correspondent pas'
            messageDiv.className = 'message error'
            return
        }

        if (password.length < 6) {
            messageDiv.innerHTML = '❌ Le mot de passe doit contenir au moins 6 caractères'
            messageDiv.className = 'message error'
            return
        }

        if (!conditions) {
            messageDiv.innerHTML = '❌ Vous devez accepter les conditions d\'utilisation'
            messageDiv.className = 'message error'
            return
        }

        // Désactiver le bouton
        submitBtn.disabled = true
        submitText.style.display = 'none'
        submitSpinner.style.display = 'inline-block'
        messageDiv.innerHTML = ''

        try {
            // Créer l'utilisateur dans Supabase Auth
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        full_name: fullname,
                        phone: phone,
                        role: role
                    }
                }
            })

            if (error) {
                throw error
            }

            if (data.user) {
                // Créer le profil dans la table users_profiles
                const { error: profileError } = await supabase
                    .from('users_profiles')
                    .insert({
                        id: data.user.id,
                        display_name: fullname,
                        email: email,
                        phone: phone,
                        role: role,
                        created_at: new Date()
                    })

                if (profileError) {
                    console.error('Erreur création profil:', profileError)
                }

                // Si c'est un guide, créer automatiquement une entrée dans la table guides
                if (role === 'guide') {
                    const nomParts = fullname.split(' ')
                    const prenom = nomParts[0] || ''
                    const nom = nomParts.slice(1).join(' ') || ''
                    
                    const { error: guideError } = await supabase
                        .from('guides')
                        .insert({
                            user_id: data.user.id,
                            prenom: prenom,
                            nom: nom,
                            email: email,
                            telephone: phone,
                            statut: 'inactif',  // En attente d'approbation admin
                            created_at: new Date()
                        })

                    if (guideError) {
                        console.error('Erreur création guide:', guideError)
                    }
                }

                messageDiv.innerHTML = '✅ Compte créé avec succès ! Redirection vers la page de connexion...'
                messageDiv.className = 'message success'

                setTimeout(() => {
                    window.location.href = 'login.html'
                }, 2000)
            }
        } catch (err) {
            messageDiv.innerHTML = '❌ ' + (err.message || 'Erreur lors de l\'inscription')
            messageDiv.className = 'message error'
            submitBtn.disabled = false
            submitText.style.display = 'inline'
            submitSpinner.style.display = 'none'
        }
    })
</script>

</body>
</html>
