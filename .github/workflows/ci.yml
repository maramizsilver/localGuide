name: CI LocalGuide

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4        # ← v3 → v4

      - name: Installer Node.js
        uses: actions/setup-node@v4      # ← v3 → v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier les variables d'environnement
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL manquant !" && exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_ANON_KEY manquant !" && exit 1
          fi

      - name: Lancer ESLint
        run: npm run lint
